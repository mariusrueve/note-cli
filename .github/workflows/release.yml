name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to validate without publishing (for example 0.1.0)'
        required: true
        default: '0.1.0'
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and release commit
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = push ]; then
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            version="${TAG#v}"
            git merge-base --is-ancestor HEAD origin/main
            grep -F "## [$version] - " CHANGELOG.md
          else
            version="$INPUT_VERSION"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fx "version = \"$version\"" pixi.toml
          echo "version=$version" >> "$GITHUB_OUTPUT"
  verify:
    needs: [prepare]
    uses: ./.github/workflows/verify.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
  publish:
    name: Publish verified release
    if: github.event_name == 'push'
    needs: [prepare, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distribution
          path: distribution
      - name: Verify downloaded files
        working-directory: distribution
        run: sha256sum -c checksums.txt
      - name: Publish verified versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          NOTE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "$TAG" distribution/* --verify-tag \
            --title "note $NOTE_VERSION" --generate-notes
