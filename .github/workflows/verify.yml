name: Verify
on:
  workflow_call:
    inputs:
      version:
        type: string
        default: snapshot
permissions:
  contents: read
jobs:
  native:
    name: Native (${{ matrix.os }}, ${{ matrix.environment }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
        environment: [default, go126]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.72.0
          environments: ${{ matrix.environment }}
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Formatting, modules, vet, coverage, integration, race, completions, installation
        run: pixi run --locked -e "$NOTE_ENVIRONMENT" check
        env:
          NOTE_ENVIRONMENT: ${{ matrix.environment }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.environment }}
          path: work/reports/
          if-no-files-found: warn
          retention-days: 7
  security:
    name: Vulnerabilities and workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.72.0
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: pixi run --locked lint-workflows
      - run: pixi run --locked security
      - name: Verify development tool dependencies
        run: pixi run --locked bash -c 'cd tools && go mod verify && go mod tidy -diff'
  build:
    name: Build portable archives
    needs: [native, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.72.0
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Build stamped binaries and checksums
        env:
          NOTE_VERSION: ${{ inputs.version }}
        run: pixi run --locked release --version "$NOTE_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution
          path: work/releases/${{ inputs.version }}/
          if-no-files-found: error
          retention-days: 7
  archives:
    name: Archive smoke (${{ matrix.os }})
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.72.0
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distribution
          path: work/distribution
      - name: Verify checksums, contents, standalone installation and terminal behavior
        env:
          NOTE_VERSION: ${{ inputs.version }}
        run: pixi run --locked verify-release work/distribution "$NOTE_VERSION"
